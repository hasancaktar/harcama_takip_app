# Statik analiz ayarları. `flutter analyze` ile çalıştırılır.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: false
    strict-raw-types: true
  errors:
    # Kullanımdan kaldırılmış API'ler ve async sonrası BuildContext kullanımı
    # artık gizlenmiyor; hepsi düzeltildi.
    unnecessary_underscores: ignore
  exclude:
    - build/**
    - lib/firebase_options.dart
    - android/**
    - ios/**
    - web/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors_in_immutables
    - prefer_final_fields
    - prefer_final_locals
    - unawaited_futures
    - use_build_context_synchronously
