name: harcama_takip
description: "Aile ve bireysel harcama, kredi kartı ve taksit takip uygulaması"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State Yönetimi & Navigasyon
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # Firebase Servisleri
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_messaging: ^15.2.0

  # Grafikler ve Görselleştirme
  fl_chart: ^0.70.0

  # Bildirimler & Zamanlama
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Yerel tercih & Ağ Durumu
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.1

  # Yardımcı Paketler
  intl: ^0.20.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
